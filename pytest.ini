[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --color=yes
    -ra
markers =
    smoke: Quick sanity tests
    regression: Full regression suite
    subscriber_info: Subscriber information tests
    package: Package activation/deactivation tests
    tariff: Tariff change tests
    blocked: Blocked number tests
    idempotency: Idempotency verification tests
    positive: Positive scenario tests
    negative: Negative scenario tests
filterwarnings =
    ignore::DeprecationWarning
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
timeout = 60
