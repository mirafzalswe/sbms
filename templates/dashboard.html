<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCELL SBMS API - Testing Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }
        .top-bar {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .top-bar h1 { font-size: 20px; color: #38bdf8; }
        .top-bar .status { display: flex; gap: 16px; align-items: center; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .status-dot.green { background: #22c55e; box-shadow: 0 0 8px #22c55e88; }
        .status-dot.red { background: #ef4444; box-shadow: 0 0 8px #ef444488; }
        .status-dot.yellow { background: #eab308; box-shadow: 0 0 8px #eab30888; }

        .container { max-width: 1400px; margin: 0 auto; padding: 24px; }

        .config-panel {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }
        .config-panel h2 { font-size: 16px; color: #94a3b8; margin-bottom: 12px; }
        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }
        .config-field label {
            display: block;
            font-size: 12px;
            color: #64748b;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .config-field input {
            width: 100%;
            padding: 8px 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #e2e8f0;
            font-size: 14px;
            font-family: 'SF Mono', 'Fira Code', monospace;
        }
        .config-field input:focus { outline: none; border-color: #38bdf8; }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-primary:hover { background: #2563eb; }
        .btn-success { background: #22c55e; color: white; }
        .btn-success:hover { background: #16a34a; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-secondary { background: #334155; color: #e2e8f0; }
        .btn-secondary:hover { background: #475569; }
        .btn-sm { padding: 6px 14px; font-size: 12px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }

        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .stat-card .number { font-size: 36px; font-weight: 700; }
        .stat-card .label { font-size: 13px; color: #94a3b8; margin-top: 4px; }
        .stat-card.total .number { color: #38bdf8; }
        .stat-card.pass .number { color: #22c55e; }
        .stat-card.fail .number { color: #ef4444; }
        .stat-card.time .number { color: #a78bfa; font-size: 28px; }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 8px;
        }
        .tab {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            color: #94a3b8;
            background: transparent;
            border: none;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .tab:hover { background: #334155; color: #e2e8f0; }
        .tab.active { background: #3b82f6; color: white; }
        .tab .count {
            background: #334155;
            padding: 1px 6px;
            border-radius: 10px;
            font-size: 11px;
            margin-left: 4px;
        }
        .tab.active .count { background: #2563eb; }

        /* Test cards */
        .test-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
        .test-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            overflow: hidden;
        }
        .test-card-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }
        .test-card-header h3 { font-size: 15px; }
        .test-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .test-badge.get { background: #22c55e22; color: #22c55e; }
        .test-badge.post { background: #eab30822; color: #eab308; }
        .test-badge.put { background: #f9731622; color: #f97316; }
        .test-badge.delete { background: #ef444422; color: #ef4444; }
        .test-badge.pending { background: #64748b22; color: #64748b; }
        .test-badge.running { background: #3b82f622; color: #3b82f6; }
        .test-badge.passed { background: #22c55e22; color: #22c55e; }
        .test-badge.failed { background: #ef444422; color: #ef4444; }

        .test-card-body { padding: 16px 20px; }
        .test-card-body .url {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 12px;
            color: #94a3b8;
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 6px;
            word-break: break-all;
            margin-bottom: 12px;
        }
        .test-card-body .description {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 12px;
        }

        .param-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 10px;
        }
        .param-input {
            padding: 5px 8px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 4px;
            color: #e2e8f0;
            font-size: 12px;
            font-family: 'SF Mono', 'Fira Code', monospace;
        }
        .param-input:focus { outline: none; border-color: #38bdf8; }
        .param-label {
            font-size: 11px;
            color: #64748b;
            padding: 6px 0 0;
            text-align: right;
        }

        .test-card-footer {
            padding: 12px 20px;
            border-top: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .response-time { font-size: 12px; color: #a78bfa; }
        .http-status { font-size: 12px; font-weight: 600; }
        .http-status.s200 { color: #22c55e; }
        .http-status.s400 { color: #eab308; }
        .http-status.s500 { color: #ef4444; }

        .response-area {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            color: #94a3b8;
            display: none;
        }
        .response-area.visible { display: block; }

        .log-panel {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
        }
        .log-panel h2 { font-size: 16px; color: #94a3b8; margin-bottom: 12px; }
        #log {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 16px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 13px;
            line-height: 1.8;
        }
        .log-pass { color: #22c55e; }
        .log-fail { color: #ef4444; }
        .log-info { color: #38bdf8; }
        .log-warn { color: #eab308; }
        .log-dim { color: #475569; }

        .hidden { display: none !important; }

        @media (max-width: 900px) {
            .test-grid { grid-template-columns: 1fr; }
            .stats { grid-template-columns: repeat(2, 1fr); }
        }

        .spinner {
            display: inline-block;
            width: 14px; height: 14px;
            border: 2px solid #334155;
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .body-editor {
            width: 100%;
            min-height: 80px;
            padding: 8px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #e2e8f0;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 12px;
            resize: vertical;
            margin-bottom: 10px;
        }
        .body-editor:focus { outline: none; border-color: #38bdf8; }

        /* ========== THEME TOGGLE ========== */
        .theme-toggle {
            display: flex; align-items: center; gap: 8px; margin-left: 12px;
            cursor: pointer; padding: 6px 12px; border-radius: 6px;
            border: 1px solid #334155; background: #0f172a; color: #94a3b8;
            font-size: 13px; font-weight: 500; transition: all .2s; user-select: none;
        }
        .theme-toggle:hover { border-color: #475569; background: #1e293b; }
        .theme-toggle .icon { font-size: 16px; line-height: 1; }

        /* ========== LIGHT THEME ========== */
        [data-theme="light"] body { background: #f5f7fa; color: #1a2332; }
        [data-theme="light"] .top-bar { background: #fff; border-bottom-color: #e2e6ec; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
        [data-theme="light"] .top-bar h1 { color: #2563eb; }
        [data-theme="light"] .theme-toggle { background: #f0f2f5; border-color: #e2e6ec; color: #5a6577; }
        [data-theme="light"] .theme-toggle:hover { background: #e2e6ec; }

        [data-theme="light"] .config-panel { background: #fff; border-color: #e2e6ec; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
        [data-theme="light"] .config-panel h2 { color: #5a6577; }
        [data-theme="light"] .config-field label { color: #8893a4; }
        [data-theme="light"] .config-field input { background: #f8f9fb; border-color: #e2e6ec; color: #1a2332; }
        [data-theme="light"] .config-field input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.1); }

        [data-theme="light"] .btn-secondary { background: #f0f2f5; color: #5a6577; }
        [data-theme="light"] .btn-secondary:hover { background: #e2e6ec; color: #1a2332; }

        [data-theme="light"] .stat-card { background: #fff; border-color: #e2e6ec; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
        [data-theme="light"] .stat-card .label { color: #8893a4; }

        [data-theme="light"] .tabs { background: #fff; border-color: #e2e6ec; }
        [data-theme="light"] .tab { color: #5a6577; }
        [data-theme="light"] .tab:hover { background: #f0f2f5; color: #1a2332; }
        [data-theme="light"] .tab .count { background: #e2e6ec; }

        [data-theme="light"] .test-card { background: #fff; border-color: #e2e6ec; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
        [data-theme="light"] .test-card-header { border-bottom-color: #e2e6ec; }
        [data-theme="light"] .test-card-header h3 { color: #1a2332; }
        [data-theme="light"] .test-card-body { color: #5a6577; }
        [data-theme="light"] .test-card-body pre { background: #f8f9fb; border-color: #e2e6ec; color: #475569; }

        [data-theme="light"] .body-editor { background: #f8f9fb; border-color: #e2e6ec; color: #1a2332; }
        [data-theme="light"] .body-editor:focus { border-color: #3b82f6; }

        [data-theme="light"] .spinner { border-color: #e2e6ec; border-top-color: #3b82f6; }

        [data-theme="light"] ::-webkit-scrollbar { width: 6px; height: 6px; }
        [data-theme="light"] ::-webkit-scrollbar-track { background: #f0f2f5; }
        [data-theme="light"] ::-webkit-scrollbar-thumb { background: #c8cdd6; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>UCELL SBMS API Testing Dashboard</h1>
        <div class="status">
            <a href="/tester" style="color:#22c55e;text-decoration:none;font-size:13px;font-weight:600;padding:6px 14px;border:1px solid #22c55e44;border-radius:6px;margin-right:12px;transition:all 0.2s;" onmouseover="this.style.background='#22c55e22'" onmouseout="this.style.background='transparent'">QA Tester</a>
            <a href="/tariff-test" style="color:#eab308;text-decoration:none;font-size:13px;font-weight:600;padding:6px 14px;border:1px solid #eab30844;border-radius:6px;margin-right:12px;transition:all 0.2s;" onmouseover="this.style.background='#eab30822'" onmouseout="this.style.background='transparent'">Тест тарифа</a>
            <a href="/matrix-test" style="color:#a855f7;text-decoration:none;font-size:13px;font-weight:600;padding:6px 14px;border:1px solid #a855f744;border-radius:6px;margin-right:12px;transition:all 0.2s;" onmouseover="this.style.background='#a855f722'" onmouseout="this.style.background='transparent'">Матрица переходов</a>
            <a href="/product-availability" style="color:#38bdf8;text-decoration:none;font-size:13px;font-weight:600;padding:6px 14px;border:1px solid #38bdf844;border-radius:6px;margin-right:12px;transition:all 0.2s;" onmouseover="this.style.background='#38bdf822'" onmouseout="this.style.background='transparent'">Доступность продукта</a>
            <a href="/tme" style="color:#f472b6;text-decoration:none;font-size:13px;font-weight:600;padding:6px 14px;border:1px solid #f472b644;border-radius:6px;margin-right:12px;transition:all 0.2s;" onmouseover="this.style.background='#f472b622'" onmouseout="this.style.background='transparent'">TME</a>
            <span id="authBadge" style="margin-right:12px;"></span>
            <span class="status-dot" id="serverStatus"></span>
            <span id="serverStatusText" style="font-size:13px; color:#94a3b8;">Not connected</span>
            <div class="theme-toggle" onclick="toggleTheme()" title="Переключить тему">
                <span class="icon" id="themeIcon">&#9790;</span>
                <span id="themeLabel">Тёмная</span>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- Config -->
        <div class="config-panel">
            <h2>CONFIGURATION</h2>
            <div class="config-grid">
                <div class="config-field">
                    <label>Login</label>
                    <input type="text" id="login" value="" placeholder="Введите логин SBMS" autocomplete="username">
                </div>
                <div class="config-field">
                    <label>Password</label>
                    <input type="password" id="password" value="" placeholder="Введите пароль" autocomplete="current-password">
                </div>
                <div class="config-field">
                    <label>Test MSISDN</label>
                    <input type="text" id="msisdn" value="" placeholder="998XXXXXXXXX">
                </div>
                <div class="config-field">
                    <label>Token (auto)</label>
                    <input type="text" id="tokenField" value="" placeholder="Появится после входа" readonly>
                </div>
                <div class="config-field">
                    <label>Customer ID (auto)</label>
                    <input type="text" id="customerIdField" value="" placeholder="Из поиска клиента">
                </div>
                <div class="config-field">
                    <label>Subscriber ID (auto)</label>
                    <input type="text" id="subscriberIdField" value="" placeholder="Из поиска клиента">
                </div>
            </div>
            <div class="actions">
                <button class="btn btn-success" onclick="doLogin()" id="loginBtn">Войти</button>
                <button class="btn btn-danger" onclick="doLogout()" id="logoutBtn" style="display:none">Выйти</button>
                <button class="btn btn-primary" onclick="runCoreTests()">Run Core Tests (1-6)</button>
                <button class="btn btn-danger" onclick="clearResults()">Clear Results</button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div class="stat-card total">
                <div class="number" id="statTotal">0</div>
                <div class="label">Total Tests</div>
            </div>
            <div class="stat-card pass">
                <div class="number" id="statPass">0</div>
                <div class="label">Passed</div>
            </div>
            <div class="stat-card fail">
                <div class="number" id="statFail">0</div>
                <div class="label">Failed</div>
            </div>
            <div class="stat-card time">
                <div class="number" id="statTime">0.00s</div>
                <div class="label">Total Time</div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs" id="tabs"></div>

        <!-- Test Cards -->
        <div class="test-grid" id="testGrid"></div>

        <!-- Log -->
        <div class="log-panel">
            <h2>TEST LOG</h2>
            <div id="log">
                <span class="log-dim">[Ready] Dashboard loaded. Press "Run Core Tests" or select a category.</span>
            </div>
        </div>
    </div>

    <script src="/static/sbms-auth.js"></script>
    <script>
        // ==================== THEME ====================
        function getTheme() { return localStorage.getItem('sbms-theme') || 'dark'; }
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const icon = document.getElementById('themeIcon');
            const label = document.getElementById('themeLabel');
            if (theme === 'dark') { icon.innerHTML = '&#9790;'; label.textContent = 'Тёмная'; }
            else { icon.innerHTML = '&#9788;'; label.textContent = 'Светлая'; }
        }
        function toggleTheme() {
            const next = getTheme() === 'dark' ? 'light' : 'dark';
            localStorage.setItem('sbms-theme', next);
            applyTheme(next);
        }
        applyTheme(getTheme());

        // ==================== AUTH (SbmsAuth) ====================
        SbmsAuth.mountBadge('#authBadge');
        // Предзаполнить поле логина, если запомнен с прошлой сессии
        document.getElementById('login').value = SbmsAuth.login || '';
        // Подхватить токен, если сессия жива
        let token = SbmsAuth.token || null;
        SbmsAuth.on((event) => {
            if (event === 'login') {
                token = SbmsAuth.token;
                document.getElementById('tokenField').value = token;
                document.getElementById('password').value = '';
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('logoutBtn').style.display = '';
                document.getElementById('serverStatus').className = 'status-dot green';
                document.getElementById('serverStatusText').textContent = 'Connected';
                refreshParamInputs();
                log('Успешная авторизация. Токен получен.', 'log-pass');
            } else if (event === 'logout') {
                token = null;
                document.getElementById('tokenField').value = '';
                document.getElementById('loginBtn').style.display = '';
                document.getElementById('logoutBtn').style.display = 'none';
                document.getElementById('serverStatus').className = 'status-dot';
                document.getElementById('serverStatusText').textContent = 'Not connected';
                refreshParamInputs();
            }
        });
        if (SbmsAuth.isValid()) {
            document.getElementById('tokenField').value = token;
            document.getElementById('loginBtn').style.display = 'none';
            document.getElementById('logoutBtn').style.display = '';
            document.getElementById('serverStatus').className = 'status-dot green';
            document.getElementById('serverStatusText').textContent = 'Connected';
        }

        async function doLogin() {
            const login = document.getElementById('login').value.trim();
            const password = document.getElementById('password').value;
            if (!login || !password) {
                try { await SbmsAuth.promptLogin(); } catch (_) {}
                return;
            }
            const btn = document.getElementById('loginBtn');
            btn.disabled = true; btn.textContent = 'Вход...';
            try {
                await SbmsAuth.authenticate(login, password);
            } catch (e) {
                log('Ошибка входа: ' + e.message, 'log-fail');
                alert('Ошибка входа: ' + e.message);
            } finally {
                btn.disabled = false; btn.textContent = 'Войти';
            }
        }

        function doLogout() {
            SbmsAuth.logout();
            log('Выход выполнен. Сессия очищена.', 'log-info');
        }

        // ==================== STATE ====================
        let customerId = null;
        let subscriberId = null;
        let totalTime = 0;
        let passCount = 0;
        let failCount = 0;
        let activeTab = 'core';

        // ==================== ALL ENDPOINTS ====================
        const endpoints = [
            // ===== CORE (6 основных тестов) =====
            {
                id: 'get_session', category: 'core', name: '1. Get Session',
                method: 'GET', path: '/OAPI/v1/tokens-stub/get',
                params: [
                    { key: 'login', label: 'Login', configRef: 'login' },
                    { key: 'password', label: 'Password', configRef: 'password' }
                ],
                description: 'Авторизация. Возвращает SESSION_ID (XML). Токен нужен для всех остальных запросов.',
                responseType: 'xml',
                onSuccess: function(data) {
                    const parser = new DOMParser();
                    const xml = parser.parseFromString(data, 'text/xml');
                    const el = xml.querySelector('SESSION_ID');
                    if (el && el.textContent) {
                        const t = el.textContent;
                        // Зарегистрировать токен в едином менеджере сессий
                        const loginName = (document.getElementById('login').value || '').trim();
                        SbmsAuth.setSession(t, 25 * 60, loginName);
                        return { ok: true, msg: `Token: ${t.substring(0, 25)}...` };
                    }
                    return { ok: false, msg: 'SESSION_ID not found in response' };
                }
            },
            {
                id: 'customer_search', category: 'core', name: '2. Customer Search Base',
                method: 'GET', path: '/OAPI/v1/customers/searchBase',
                params: [
                    { key: 'identification', label: 'MSISDN', configRef: 'msisdn' },
                    { key: 'authToken', label: 'Token', tokenRef: true }
                ],
                description: 'Поиск клиента по MSISDN. Возвращает customerId, subscriberId, ФИО, тариф.',
                onSuccess: function(data) {
                    const count = data.listInfo?.count || 0;
                    if (count > 0) {
                        const sr = data.searchResults[0];
                        customerId = sr.customerId;
                        subscriberId = sr.subscriberId;
                        document.getElementById('customerIdField').value = customerId || '';
                        document.getElementById('subscriberIdField').value = subscriberId || '';
                        const name = sr.customer?.name || 'N/A';
                        const plan = sr.firstSubscriber?.ratePlan?.name || 'N/A';

        // ==================== CONFIG HELPERS ====================
        function getConfig() {
            return {
                proxyUrl: '/proxy',
                login: document.getElementById('login').value,
                password: document.getElementById('password').value,
                msisdn: document.getElementById('msisdn').value
            };
        }

        function getParamValue(p) {
            const cfg = getConfig();
            if (p.tokenRef) return SbmsAuth.token || token || '';
            if (p.configRef) return cfg[p.configRef] || '';
            if (p.stateRef) {
                if (p.stateRef === 'customerId') return customerId || document.getElementById('customerIdField').value || '';
                if (p.stateRef === 'subscriberId') return subscriberId || document.getElementById('subscriberIdField').value || '';
            }
            return p.value || '';
        }

        function getStateValue(name) {
            if (name === 'customerId') return customerId || document.getElementById('customerIdField').value || '';
            if (name === 'subscriberId') return subscriberId || document.getElementById('subscriberIdField').value || '';
            return '';
        }

        // ==================== UI HELPERS ====================
        function log(msg, cls = '') {
            const el = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            el.innerHTML += `\n<span class="${cls}">[${time}] ${msg}</span>`;
            el.scrollTop = el.scrollHeight;
        }

        function updateStats() {
            document.getElementById('statTotal').textContent = passCount + failCount;
            document.getElementById('statPass').textContent = passCount;
            document.getElementById('statFail').textContent = failCount;
            document.getElementById('statTime').textContent = `${(totalTime / 1000).toFixed(2)}s`;
        }

        function clearResults() {
            // Сессию (token) не трогаем — чистим только результаты тестов
            customerId = null;
            subscriberId = null;
            totalTime = 0;
            passCount = 0;
            failCount = 0;
            updateStats();
            document.getElementById('customerIdField').value = '';
            document.getElementById('subscriberIdField').value = '';
            document.querySelectorAll('.ep-status').forEach(el => {
                el.className = 'test-badge pending ep-status';
                el.textContent = 'PENDING';
            });
            document.querySelectorAll('.ep-time').forEach(el => el.textContent = '-');
            document.querySelectorAll('.ep-http').forEach(el => { el.textContent = '-'; el.className = 'http-status ep-http'; });
            document.querySelectorAll('.response-area').forEach(el => el.classList.remove('visible'));
            document.getElementById('log').innerHTML = '<span class="log-dim">[Ready] Cleared.</span>';
            // Не сбрасываем коннект-статус — сессия могла остаться жива
        }

        // ==================== RENDER ====================
        function renderTabs() {
            const tabsEl = document.getElementById('tabs');
            let html = '';
            for (const [key, label] of Object.entries(categories)) {
                const count = endpoints.filter(e => e.category === key).length;
                if (count === 0) continue;
                html += `<button class="tab ${key === activeTab ? 'active' : ''}" onclick="switchTab('${key}')">${label}<span class="count">${count}</span></button>`;
            }
            tabsEl.innerHTML = html;
        }

        function renderCards() {
            const grid = document.getElementById('testGrid');
            let html = '';
            for (const ep of endpoints) {
                const isVisible = ep.category === activeTab;
                const methodClass = ep.method.toLowerCase();

                let paramsHtml = '';
                if (ep.params && ep.params.length > 0) {
                    paramsHtml = '<div class="param-grid">';
                    for (const p of ep.params) {
                        const val = getParamValue(p);
                        paramsHtml += `<span class="param-label">${p.label}:</span>`;
                        paramsHtml += `<input class="param-input" id="param_${ep.id}_${p.key}" value="${escapeHtml(val)}" placeholder="${p.key}">`;
                    }
                    paramsHtml += '</div>';
                }

                let bodyHtml = '';
                if (ep.body) {
                    bodyHtml = `<textarea class="body-editor" id="body_${ep.id}">${JSON.stringify(ep.body, null, 2)}</textarea>`;
                }

                html += `
                <div class="test-card ${isVisible ? '' : 'hidden'}" data-category="${ep.category}" id="card_${ep.id}">
                    <div class="test-card-header">
                        <h3>${ep.name}</h3>
                        <div style="display:flex;gap:6px;align-items:center">
                            <span class="test-badge ${methodClass}">${ep.method}</span>
                            <button class="btn btn-primary btn-sm" onclick="runSingleEndpoint('${ep.id}')">Run</button>
                        </div>
                    </div>
                    <div class="test-card-body">
                        <div class="url">${ep.path}</div>
                        <div class="description">${ep.description}</div>
                        ${paramsHtml}
                        ${bodyHtml}
                        <div class="test-badge pending ep-status" id="status_${ep.id}">PENDING</div>
                        <div class="response-area" id="resp_${ep.id}"></div>
                    </div>
                    <div class="test-card-footer">
                        <span class="response-time ep-time" id="time_${ep.id}">-</span>
                        <span class="http-status ep-http" id="http_${ep.id}">-</span>
                    </div>
                </div>`;
            }
            grid.innerHTML = html;
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function switchTab(tab) {
            activeTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.tab[onclick="switchTab('${tab}')"]`).classList.add('active');
            document.querySelectorAll('.test-card').forEach(card => {
                card.classList.toggle('hidden', card.dataset.category !== tab);
            });
        }

        // ==================== API CALLS ====================
        async function fetchAPI(url, options = {}) {
            const start = performance.now();
            try {
                const resp = await fetch(url, options);
                const elapsed = performance.now() - start;
                totalTime += elapsed;

                let data;
                const ct = resp.headers.get('content-type') || '';
                if (ct.includes('json')) {
                    data = await resp.json();
                } else {
                    data = await resp.text();
                }
                if (resp.status === 401 || resp.status === 403) {
                    SbmsAuth.clearSession('expired');
                    log('Сессия SBMS истекла — требуется повторный вход.', 'log-warn');
                }
                return { ok: resp.ok, status: resp.status, data, elapsed };
            } catch (e) {
                const elapsed = performance.now() - start;
                totalTime += elapsed;
                return { ok: false, status: 0, data: e.message, elapsed };
            }
        }

        async function runSingleEndpoint(id) {
            const ep = endpoints.find(e => e.id === id);
            if (!ep) return;

            // Все эндпоинты кроме авторизации требуют валидной сессии
            if (id !== 'get_session' && !SbmsAuth.isValid()) {
                log('Нет активной сессии. Требуется вход.', 'log-warn');
                try { await SbmsAuth.promptLogin('Требуется авторизация для выполнения запросов'); }
                catch (_) { return false; }
            }

            const cfg = getConfig();

            // Read param values — синхронизировать с текущей конфигурацией
            const params = {};
            if (ep.params) {
                for (const p of ep.params) {
                    const input = document.getElementById(`param_${ep.id}_${p.key}`);
                    // Для params с configRef/tokenRef — всегда брать актуальное значение из конфига
                    if (p.configRef || p.tokenRef) {
                        const freshVal = getParamValue(p);
                        if (input) input.value = freshVal;
                        if (freshVal) params[p.key] = freshVal;
                    } else {
                        const val = input ? input.value : getParamValue(p);
                        if (val) params[p.key] = val;
                    }
                }
            }

            // Build path with path params
            let path = ep.path;
            if (ep.pathParams) {
                for (const pp of ep.pathParams) {
                    const val = getStateValue(pp);
                    path = path.replace(`{${pp}}`, val);
                }
            }
            // Also replace any remaining {paramName} from query params
            path = path.replace(/\{(\w+)\}/g, (match, name) => {
                return params[name] || match;
            });

            // Build URL
            const queryStr = new URLSearchParams(params).toString();
            const url = `${cfg.proxyUrl}${path}${queryStr ? '?' + queryStr : ''}`;

            // Status
            const statusEl = document.getElementById(`status_${ep.id}`);
            statusEl.className = 'test-badge running ep-status';
            statusEl.textContent = 'RUNNING';
            log(`Running: ${ep.name} [${ep.method} ${path}]`, 'log-info');

            // Build fetch options
            const options = { method: ep.method };
            if (ep.method === 'POST' || ep.method === 'PUT' || ep.method === 'PATCH') {
                const bodyEl = document.getElementById(`body_${ep.id}`);
                if (bodyEl) {
                    try {
                        options.headers = { 'Content-Type': 'application/json' };
                        options.body = bodyEl.value;
                    } catch (e) {
                        options.headers = { 'Content-Type': 'application/json' };
                        options.body = bodyEl.value;
                    }
                }
            }

            const result = await fetchAPI(url, options);

            // Update UI
            document.getElementById(`time_${ep.id}`).textContent = `${(result.elapsed / 1000).toFixed(2)}s`;

            const httpEl = document.getElementById(`http_${ep.id}`);
            httpEl.textContent = result.status ? `HTTP ${result.status}` : 'ERR';
            if (result.status >= 200 && result.status < 300) httpEl.className = 'http-status s200 ep-http';
            else if (result.status >= 400 && result.status < 500) httpEl.className = 'http-status s400 ep-http';
            else httpEl.className = 'http-status s500 ep-http';

            const respEl = document.getElementById(`resp_${ep.id}`);
            respEl.textContent = typeof result.data === 'string' ? result.data : JSON.stringify(result.data, null, 2);
            respEl.classList.add('visible');

            if (result.status === 0) {
                statusEl.className = 'test-badge failed ep-status';
                statusEl.textContent = 'FAILED';
                failCount++;
                log(`FAIL: ${ep.name} - ${result.data}`, 'log-fail');
                document.getElementById('serverStatus').className = 'status-dot red';
                document.getElementById('serverStatusText').textContent = 'Error';
                updateStats();
                return false;
            }

            // Custom success handler
            if (ep.onSuccess && result.ok) {
                const res = ep.onSuccess(result.data);
                if (res.ok) {
                    statusEl.className = 'test-badge passed ep-status';
                    statusEl.textContent = 'PASSED';
                    passCount++;
                    log(`PASS: ${ep.name} - ${res.msg}`, 'log-pass');
                    updateStats();
                    return true;
                } else {
                    statusEl.className = 'test-badge failed ep-status';
                    statusEl.textContent = 'FAILED';
                    failCount++;
                    log(`FAIL: ${ep.name} - ${res.msg}`, 'log-fail');
                    updateStats();
                    return false;
                }
            }

            if (result.ok) {
                statusEl.className = 'test-badge passed ep-status';
                statusEl.textContent = 'PASSED';
                passCount++;
                log(`PASS: ${ep.name} - HTTP ${result.status}`, 'log-pass');
                updateStats();
                return true;
            } else {
                statusEl.className = 'test-badge failed ep-status';
                statusEl.textContent = 'FAILED';
                failCount++;
                log(`FAIL: ${ep.name} - HTTP ${result.status}`, 'log-fail');
                updateStats();
                return false;
            }
        }

        // ==================== CORE TESTS ====================
        async function runCoreTests() {
            clearResults();
            log('Starting Core Tests (1-6)...', 'log-info');

            const ok1 = await runSingleEndpoint('get_session');
            if (!ok1) {
                log('Auth failed. Remaining tests skipped.', 'log-warn');
                return;
            }

            // Refresh param inputs with new token
            refreshParamInputs();

            const ok2 = await runSingleEndpoint('customer_search');
            if (ok2) refreshParamInputs();

            if (subscriberId) await runSingleEndpoint('rt_discounts');
            else { failCount++; log('SKIP: RT Discounts - no subscriberId', 'log-warn'); }

            if (customerId) await runSingleEndpoint('custom_attributes');
            else { failCount++; log('SKIP: Custom Attributes - no customerId', 'log-warn'); }

            await runSingleEndpoint('inquiry_props');
            await runSingleEndpoint('free_numbers');

            updateStats();
            log(`Done! ${passCount} passed, ${failCount} failed, total ${(totalTime / 1000).toFixed(2)}s`,
                failCount === 0 ? 'log-pass' : 'log-warn');
        }

        function refreshParamInputs() {
            // Refresh all token/state/config-dependent inputs
            const cfg = getConfig();
            for (const ep of endpoints) {
                if (!ep.params) continue;
                for (const p of ep.params) {
                    const input = document.getElementById(`param_${ep.id}_${p.key}`);
                    if (!input) continue;
                    if (p.tokenRef && token) input.value = token;
                    if (p.configRef && cfg[p.configRef]) input.value = cfg[p.configRef];
                    if (p.stateRef === 'customerId' && customerId) input.value = customerId;
                    if (p.stateRef === 'subscriberId' && subscriberId) input.value = subscriberId;
                }
            }
        }

        // ==================== INIT ====================
        renderTabs();
        renderCards();
    </script>
</body>
</html>
